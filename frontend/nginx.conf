# SPA shell + reverse-proxy /api/ to the FastAPI backend.
# In docker-compose, the backend service is reachable at http://backend:8000.

server {
    listen 80;
    server_name _;

    client_max_body_size 12m;  # align with backend MAX_UPLOAD_MB + headroom

    # Static SPA — fall back to index.html for client-side routes
    root /usr/share/nginx/html;
    index index.html;

    # Long-cache hashed assets
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Proxy API calls (and uploaded photos served by FastAPI) to the backend
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Photos can be a few MB
        proxy_read_timeout 60s;
    }

    # Cloudinary/local upload paths the backend exposes at /uploads/
    location /uploads/ {
        proxy_pass http://backend:8000/uploads/;
    }

    # Everything else — SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
